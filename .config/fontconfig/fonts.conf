<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Fira</family>
   <family>Vazirmatn</family>
   <family>Joy Pixels</family>
   <family>Noto Color Emoji</family>
   <family>Font Awesome 7 Free</family>
  </prefer>
 </alias>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Fira</family>
   <family>Vazirmatn</family>
   <family>Joy Pixels</family>
   <family>Noto Color Emoji</family>
   <family>Font Awesome 7 Free</family>
  </prefer>
 </alias>
 <alias>
  <family>sans</family>
  <prefer>
   <family>Fira Sans</family>
   <family>Vazirmatn</family>
   <family>Joy Pixels</family>
   <family>Noto Color Emoji</family>
   <family>Font Awesome 7 Free</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>FiraCode Nerd Font Mono</family>
   <family>Noto Sans Mono</family>
   <family>Joy Pixels</family>
   <family>Noto Color Emoji</family>
   <family>Font Awesome 7 Free</family>
  </prefer>
 </alias>
</fontconfig>