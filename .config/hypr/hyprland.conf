
monitor=,1920x1080@164.99,auto,1

$terminal = alacritty
$fileManager = alacritty -T filemanager --class lf -e lf
$menu = wofi --show drun


#################
### AUTOSTART ###
#################

exec-once = swww-daemon &
exec-once = udiskie --no-tray --smart &
exec-once = waybar &

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 20

    border_size = 2

    # One Dark palette
    col.active_border = rgba(61afefee) rgba(c678ddff) 45deg  # blue to purple
    col.inactive_border = rgba(282c34cc)  # background dark

    resize_on_border = false

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 12
    
    # Opacity settings for modern glass effect
    active_opacity = 0.98
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    # Drop shadow configuration
    shadow {
        enabled = true
        range = 8
        render_power = 4
        offset = 0 2
    }

    # col.shadow = rgba(00000080)  # Semi-transparent black
    # col.shadow_inactive = rgba(00000040)  # Lighter shadow for inactive

    # Blur settings for modern look
    # blur {
    #     enabled = true
    #     size = 8
    #     passes = 3
    #     new_optimizations = true
    #     xray = false
    #     ignore_opacity = false
    #     noise = 0.02
    #     contrast = 1.1
    #     brightness = 1.0
    #     vibrancy = 0.15
    #     vibrancy_darkness = 0.2
    #     popups = true
    #     popups_ignorealpha = 0.6
    # }

    # # Alternative blur settings (OPTION 1) - Stronger blur effect
    # blur {
    #     enabled = true
    #     size = 12
    #     passes = 4
    #     new_optimizations = true
    #     noise = 0.01
    #     contrast = 1.2
    #     brightness = 1.1
    #     vibrancy = 0.25
    #     vibrancy_darkness = 0.15
    # }

    # Alternative blur settings (OPTION 2) - Performance focused
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        noise = 0.03
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.10
    }
}

animations {
    enabled = yes, please :)

    # Smooth & Fluid (ACTIVE) - Elegant and smooth transitions
    # bezier = easeOutQuint,0.23,1,0.32,1
    # bezier = easeInOutCubic,0.65,0.05,0.36,1
    # bezier = smoothOut,0.36,0,0.66,-0.56
    # bezier = smoothIn,0.25,0.46,0.45,0.94
    # bezier = overshot,0.13,0.99,0.29,1.1

    # animation = windows, 1, 5, easeOutQuint, slide
    # animation = windowsIn, 1, 5, easeOutQuint, slide
    # animation = windowsOut, 1, 5, smoothOut, slide
    # animation = border, 1, 6, easeOutQuint
    # animation = fade, 1, 4, smoothIn
    # animation = workspaces, 1, 6, easeOutQuint, slide

    # # Bouncy & Playful (OPTION 1) - Fun bouncy animations
    # bezier = bounce,0.25,0.46,0.45,0.94
    # bezier = bounceOut,0.34,1.56,0.64,1
    # bezier = elastic,0.68,-0.55,0.265,1.55
    # 
    # animation = windows, 1, 6, elastic, slide
    # animation = windowsIn, 1, 6, bounceOut, slide
    # animation = windowsOut, 1, 4, bounce, slide
    # animation = border, 1, 8, elastic
    # animation = fade, 1, 5, bounce
    # animation = workspaces, 1, 7, elastic, slide

    # Snappy & Fast (OPTION 2) - Quick and responsive
    bezier = snap,0.25,0.46,0.45,0.94
    bezier = quick,0.76,0,0.24,1
    bezier = instant,1,0,0,1
    
    animation = windows, 1, 3, quick, slide
    animation = windowsIn, 1, 3, snap, slide
    animation = windowsOut, 1, 2, instant, slide
    animation = border, 1, 4, quick
    animation = fade, 1, 3, snap
    animation = workspaces, 1, 4, quick, slide
}

# # Smart gaps
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0
windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
windowrule = rounding 0, floating:0, onworkspace:w[tv1]
windowrule = bordersize 0, floating:0, onworkspace:f[1]
windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    key_press_enables_dpms = true
    enable_swallow = true
    swallow_regex = ^(Alacritty)$
}

input {
    kb_layout = us,ir
    kb_variant =
    kb_model =
    kb_options = grp:shifts_toggle
    kb_rules =
    repeat_rate = 50
    repeat_delay = 300
    numlock_by_default = true

    follow_mouse = 1

    sensitivity = 0
    
}

gestures {
    workspace_swipe = false
}

binds {
    workspace_back_and_forth = true
}


$mainMod = SUPER

bind = $mainMod, M, exit,

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, pkill wofi || $menu

bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pin,
bind = $mainMod SHIFT, P, pseudo,
bind = $mainMod SHIFT, J, togglesplit,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim -g "$(slurp -d)" - | wl-copy


bindl = , XF86AudioPlay, exec, playerctl play-pause

bindl = , XF86AudioNext, exec, playerctl next
binde = SUPER, XF86AudioNext, exec, playerctl position 10+

bindl = , XF86AudioPrev, exec, playerctl previous
binde = SUPER, XF86AudioPrev, exec, playerctl position 10-

binde = , XF86AudioRaiseVolume, exec, pamixer -i 10
binde = , XF86AudioLowerVolume, exec, pamixer -d 10
binde = , XF86AudioMute, exec, pamixer -t

# Window rules
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# MPV - prevent screen sleep during video playback
windowrulev2 = idleinhibit focus, class:^(mpv)$

# Windscribe VPN - fix resize issues
windowrulev2 = float, class:^(Windscribe2)$
windowrulev2 = size 380 520, class:^(Windscribe2)$
windowrulev2 = center, class:^(Windscribe2)$
windowrulev2 = minsize 350 480, class:^(Windscribe2)$
windowrulev2 = maxsize 450 600, class:^(Windscribe2)$

# Picture-in-Picture rules
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = move 67% 72%, title:^(Picture-in-Picture)$
windowrulev2 = size 33% 28%, title:^(Picture-in-Picture)$ 

