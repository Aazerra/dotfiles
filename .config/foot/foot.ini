# Foot terminal configuration matching alacritty.toml settings
# One Dark theme with opacity, padding, and cursor settings

[main]
# Font configuration
font = monospace:size=10
# Equivalent to alacritty's font size = 10

# Window settings
pad = 10x10  # Equivalent to alacritty's padding x=10, y=10

[colors]
# One Dark colorscheme matching alacritty
alpha = 0.8  # Equivalent to alacritty's opacity = 0.8

# Primary colors
foreground = abb2bf  # Foreground color
background = 282c34  # Background color

# Normal colors (0-7)
regular0 = 282c34  # black
regular1 = e06c75  # red
regular2 = 98c379  # green
regular3 = e5c07b  # yellow
regular4 = 61afef  # blue
regular5 = c678dd  # magenta
regular6 = 56b6c2  # cyan
regular7 = abb2bf  # white

# Bright colors (8-15)
bright0 = 5c6370   # bright black
bright1 = e06c75   # bright red
bright2 = 98c379   # bright green
bright3 = e5c07b   # bright yellow
bright4 = 61afef   # bright blue
bright5 = c678dd   # bright magenta
bright6 = 56b6c2   # bright cyan
bright7 = ffffff   # bright white

[cursor]
# Beam cursor with blinking (matching alacritty)
style = beam
blink = yes